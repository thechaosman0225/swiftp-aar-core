name: Build SwiFTP Core AAR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-aar
  cancel-in-progress: true

jobs:
  build-aar:
    name: Build SwiFTP Core AAR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Release AAR
        run: ./gradlew :swiftp-core:assembleRelease --stacktrace

      - name: Collect AAR
        run: |
          mkdir -p aar-output
          cp swiftp-core/build/outputs/aar/swiftp-core-release.aar aar-output/swiftp.aar
          echo "Generated AAR:"
          ls -lh aar-output

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: swiftp-core-aar
          path: aar-output/swiftp.aar
          retention-days: 7